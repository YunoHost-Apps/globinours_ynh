#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2
id = "globinours"
name = "Globinours"
description.en = "Lightweight animal shelter management"
description.fr = "Gestion légère et complète pour refuges animaliers"
version = "1.0.0-rc.14~ynh1"
maintainers = ["OverSu"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://globinours.fr"
demo = "https://demo.globinours.fr"
code = "https://nnsprod.com/git/oversu/Globinours"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "300M"
ram.build = "100M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://nnsprod.com/git/oversu/Globinours/archive/ccaeb2b535aab28d9165898f8983e764a670734f.tar.gz"
    sha256 = "95d5346f5f02c4c153dad230170b79fee6006c66a3a4f39fae8c955ca11b8414"
    in_subdir = true
    autoupdate.strategy = "latest_forgejo_commit"
    autoupdate.upstream = "https://nnsprod.com/git/oversu/Globinours"
    [resources.system_user]
    [resources.install_dir]
    [resources.data_dir]
    subdirs = ["association", "grants", "medical-documents", "private-media", "media", "storage/logs", "storage/backups", "storage/releases"]
    [resources.permissions]
    main.url = "/"
    [resources.apt]
    packages = "php8.2-fpm, php8.2-cli, php8.2-sqlite3, php8.2-mbstring, php8.2-xml, php8.2-zip, php8.2-gd, php8.2-curl, php8.2-intl, sqlite3"
