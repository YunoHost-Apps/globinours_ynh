#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "globinours"
name = "Globinours"
description.en = "Managing animal shelters and animal welfare associations"
description.fr = "Gestion des refuges pour animaux et des associations de protection des animaux"

version = "1.0~ynh1"

maintainers = [ ]

[upstream]
license = "free"
website = "https://globinours.fr"
code = "https://nnsprod.com/git/oversu/Globinours"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://nnsprod.com/git/oversu/Globinours/archive/d7fb2b4413e18a6a792b77e547e6dc50715c87bb.tar.gz"
    sha256 = "70aa4ecb23983b5ea3bb3945df1e6e355bcab98067eca6d62debea3240fb0a6e"
    autoupdate.strategy = "latest_forgejo_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.2-sqlite3, php8.2-zip, php8.2-curl, php8.2-mbstring,, php8.2-gd, libreoffice"
